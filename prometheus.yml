global:
  scrape_interval: 15s
  scrape_timeout: 15s

scrape_configs:
  - job_name: "hybrid-search-apps"
    metrics_path: /metrics
    static_configs:
      - targets:
          - app1:8000
          - app2:8000
          - app3:8000

  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090